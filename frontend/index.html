<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Sistema de gestão para clínica médica."
    />

    <meta
      name="theme-color"
      content="#f5f8f9"
    />

    <script>
      ;(() => {
        const storageKey =
          'clinica-medica-theme'

        const storedTheme =
          localStorage.getItem(
            storageKey,
          )

        const preference =
          storedTheme === 'light' ||
          storedTheme === 'dark' ||
          storedTheme === 'system'
            ? storedTheme
            : 'system'

        const systemDark =
          window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches

        const resolvedTheme =
          preference === 'system'
            ? (
              systemDark
                ? 'dark'
                : 'light'
            )
            : preference

        document.documentElement.setAttribute(
          'data-theme',
          resolvedTheme,
        )

        document.documentElement.style.colorScheme =
          resolvedTheme

        const themeColor =
          resolvedTheme === 'dark'
            ? '#091319'
            : '#f5f8f9'

        const metaThemeColor =
          document.querySelector(
            'meta[name="theme-color"]',
          )

        metaThemeColor?.setAttribute(
          'content',
          themeColor,
        )
      })()
    </script>

    <title>
      Clínica Médica | Galera do TI
    </title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
